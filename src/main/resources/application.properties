# =========================================================
# BichoTel - configuracao da aplicacao Spring Boot
# =========================================================

server.port=8080

# --- Banco de dados MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/bichotel?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=331166cava
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: cria/ajusta as tabelas automaticamente a partir das entidades.
# Troque para "validate" depois que o schema estiver estavel em producao.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Static resources (front-end HTML/CSS/JS) ---
spring.web.resources.static-locations=classpath:/static/
